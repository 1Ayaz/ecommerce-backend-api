name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes — prevents Render free tier from spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch: # Also allows manual trigger from GitHub Actions tab

jobs:
  ping:
    name: Ping Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        run: |
          echo "Pinging Mubarak backend at $(date)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ecommerce-backend-api-qzgf.onrender.com/)
          echo "Response status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: Backend returned status $STATUS"
          else
            echo "Backend is alive ✅"
          fi
